<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weight Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs/lib/browser/math.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{--accent:#4f46a5;--accent2:#423b8f;--soft:#eeefff;--text:#1f2937;--muted:#667085;--border:#d9dee8;--surface:#fff;--subtle:#f7f8fa;--page:#f3f5f8;--ok:#247a48;--warn:#966000;--warn-bg:#fff7e5;--danger:#b33a3a}
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;background:var(--page);color:var(--text);font:16px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
    button,input{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.5}
    .shell{width:min(calc(100% - 40px),1320px);margin:auto;padding:24px 0 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:10px}.brand-mark,.empty-icon{display:grid;place-items:center;border-radius:7px;background:var(--accent);color:#fff}
    .brand-mark{width:34px;height:34px}.brand h1{margin:0;font-size:1.35rem;letter-spacing:0}
    svg{width:17px;height:17px;stroke-width:2}
    .layout{display:grid;grid-template-columns:minmax(0,920px);justify-content:center;align-items:start;gap:24px}
    .layout.has-data{grid-template-columns:minmax(0,1fr) minmax(340px,410px);justify-content:stretch}
    .editor,.inspector{min-width:0}.inspector{display:none;position:sticky;top:20px}.has-data .inspector{display:block}
    .heading,.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .heading{margin-bottom:14px}.heading h2,.panel-heading h2{margin:0;font-size:1.05rem;letter-spacing:0}
    .kicker,.panel-meta{margin:3px 0 0;color:var(--muted);font-size:.86rem}
    .allocation{min-width:220px;text-align:right}.allocation-line{min-height:22px;color:var(--muted);font-size:.86rem;font-weight:650}
    .allocation-line.ok{color:var(--ok)}.allocation-line.warn{color:var(--warn)}
    .track{width:220px;height:6px;margin-top:7px;overflow:hidden;border-radius:3px;background:#e4e7ec}
    .fill{height:100%;width:0;background:var(--accent);transition:width .18s}.fill.ok{background:var(--ok)}.fill.over{background:var(--danger)}
    .category-list{display:grid;gap:12px}.group{overflow:hidden;border:1px solid var(--border);border-left:4px solid var(--group-color);border-radius:8px;background:var(--surface)}
    .group.invalid{border-color:#e7b45d;border-left-color:var(--group-color)}.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px 108px;align-items:center;gap:14px;min-height:58px;padding:10px 12px}
    .children{border-top:1px solid var(--border);background:var(--group-soft)}.children .children{background:var(--group-soft-deep)}.node+.node{border-top:1px solid #e5e8ee}
    .node>.row{padding-left:calc(12px + var(--depth)*26px)}.node>.row::before{content:"";position:absolute;left:calc(14px + (var(--depth) - 1)*26px);top:0;width:13px;height:29px;border-left:2px solid color-mix(in srgb,var(--group-color) 45%,transparent);border-bottom:2px solid color-mix(in srgb,var(--group-color) 45%,transparent);border-radius:0 0 0 4px;pointer-events:none}.main{min-width:0}
    .name{width:100%;min-width:0;height:36px;padding:6px 9px;border:1px solid transparent;border-radius:6px;outline:0;background:transparent;color:var(--text);font-weight:650}
    .name:hover{border-color:var(--border);background:#fff}.name:focus,.weight:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft);background:#fff}
    .meta{min-height:18px;margin:-2px 9px 0;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}.meta.ok{color:var(--ok)}.meta.warn{color:var(--warn)}
    .weight-cell{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:9px}.weight{width:92px;height:36px;padding:6px 9px;border:1px solid #c7cedb;border-radius:6px;outline:0;background:#fff;font-variant-numeric:tabular-nums}
    .equivalent{color:var(--muted);font-size:.82rem;white-space:nowrap}.actions{display:flex;justify-content:flex-end;gap:4px}
    .icon-btn,.btn,.text-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text)}
    .icon-btn{width:32px;height:32px;padding:0}.icon-btn:hover,.text-btn:hover{border-color:#b7b3e6;background:var(--soft);color:var(--accent)}.icon-btn.danger:hover{color:var(--danger);background:#fff0f0;border-color:#e4aaaa}
    .btn,.text-btn{min-height:40px;gap:8px;padding:8px 13px;font-weight:650}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.primary:hover:not(:disabled){background:var(--accent2)}
    .text-btn{min-height:36px;padding:6px 10px;border-color:transparent;background:transparent;color:var(--muted)}
    .generate{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:10px;border:1px solid var(--border);border-radius:7px;background:#fff}.generate label{color:var(--muted);font-size:.84rem;font-weight:650}.count{width:72px;height:34px;padding:5px 8px;border:1px solid #c7cedb;border-radius:6px}
    .editor-footer{margin-top:14px}.empty{display:grid;min-height:300px;place-items:center;border:1px dashed #c7cedb;border-radius:8px;background:#ffffff8c;text-align:center}.empty>div{max-width:340px;padding:36px 20px}
    .empty-icon{width:42px;height:42px;margin:0 auto 12px;background:var(--soft);color:var(--accent)}.empty h2{margin:0 0 6px;font-size:1.05rem}.empty p{margin:0 0 18px;color:var(--muted);font-size:.9rem}
    .panel{overflow:hidden;border:1px solid var(--border);border-radius:8px;background:#fff}.panel-heading{padding:15px 16px 12px;border-bottom:1px solid var(--border)}
    #chartBox{position:relative;min-height:180px;padding:12px 14px 4px;transition:height .18s}#chart{width:100%!important;height:100%!important}
    .calculate{padding:12px 16px 16px;border-top:1px solid var(--border)}.calculate .btn{width:100%}
    .status{margin:0 0 10px;color:var(--muted);font-size:.84rem}.status.error{color:var(--warn)}.status.ok{color:var(--ok)}
    #results{display:none;grid-column:1/-1;width:min(100%,1000px);justify-self:center}.layout.has-results #results{display:block}.layout.has-results .inspector{position:static}
    .result-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:12px 16px 12px 12px;border-bottom:1px solid #e1e5eb;border-left:4px solid var(--result-color);background:var(--result-bg)}.result-row:last-child{border-bottom:0}
    .result-name{overflow-wrap:anywhere;font-size:.9rem;font-weight:650}.result-meta{margin-top:2px;color:var(--muted);font-size:.78rem}.integer{min-width:46px;color:var(--accent);font-size:1.3rem;font-weight:750;text-align:right}
    .stale-wrap:not(:empty){padding:12px 16px 0}.stale{padding:9px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:.82rem;font-weight:650}
    @media(max-width:1050px){.layout.has-data{grid-template-columns:minmax(0,1fr);max-width:920px;margin:auto}.inspector{position:static}}
    @media(max-width:680px){.shell{width:calc(100% - 24px);padding-top:14px}.topbar{margin-bottom:18px}.brand h1{font-size:1.15rem}.heading{display:grid}.allocation{min-width:0;text-align:left}.track{width:100%}
      .row{grid-template-columns:minmax(0,1fr) 70px;gap:8px 10px;padding:10px}.node>.row{padding-left:calc(10px + var(--depth)*20px)}.node>.row::before{left:calc(10px + (var(--depth) - 1)*20px);width:11px}.weight-cell{grid-column:1;grid-row:2;margin-left:9px}.actions{grid-column:2;grid-row:1/span 2;align-self:center;flex-wrap:wrap}.generate{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><i data-lucide="list-tree"></i></span><h1>Weight Tool</h1></div>
      <button id="reset" class="text-btn" onclick="resetAll()"><i data-lucide="rotate-ccw"></i>Reset</button>
    </header>
    <main id="layout" class="layout">
      <section class="editor">
        <div class="heading">
          <div><h2>Categories</h2><p class="kicker">Use proportions such as 1/3, 0.5 or 1.</p></div>
          <div class="allocation"><div id="rootAllocation" class="allocation-line"></div><div class="track"><div id="rootProgress" class="fill"></div></div></div>
        </div>
        <div id="categories"></div><div id="editorFooter" class="editor-footer"></div>
      </section>
      <aside id="inspector" class="inspector" aria-live="polite">
        <section class="panel preview">
          <div class="panel-heading"><div><h2>Distribution</h2><p id="chartMeta" class="panel-meta"></p></div></div>
          <div id="chartBox"><canvas id="chart"></canvas></div>
          <div class="calculate"><p id="status" class="status"></p><button class="btn primary" data-calculate onclick="finalize()"><i data-lucide="calculator"></i><span id="calculateLabel">Calculate results</span></button></div>
        </section>
      </aside>
      <section id="results" class="panel"></section>
    </main>
  </div>
  <script>
    let categories=[],myChart=null,hasResults=false,resultsStale=false,activeGenerate=null;
    const palette=[
      {color:"#4f6fae",soft:"#f3f6fb",deep:"#eaf0f8"},
      {color:"#43815e",soft:"#f2f8f4",deep:"#e8f2eb"},
      {color:"#9b5d7a",soft:"#faf3f6",deep:"#f3e8ed"},
      {color:"#477f87",soft:"#f1f7f8",deep:"#e6f0f1"},
      {color:"#735f9b",soft:"#f6f3fa",deep:"#ede8f4"},
    ];
    const num=f=>typeof f==="number"?f:math.number(f);
    const esc=v=>String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
    const ico=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
    function icons(){if(window.lucide)lucide.createIcons()}
    function parseWeight(v){if(!v)return math.fraction(0);v=v.trim().replace(",",".");try{return math.fraction(v)}catch{const n=Number(v);return Number.isFinite(n)?math.fraction(n):math.fraction(0)}}
    function formatWeight(w){const f=math.fraction(w),n=Number(f.n)*Number(f.s),d=Number(f.d);return d===1?String(n):n+"/"+d}
    function sum(list){return list.reduce((a,c)=>math.add(a,c.weight),math.fraction(0))}
    function balance(list){const pct=num(sum(list))*100,d=pct-100;if(Math.abs(d)<.0001)return{cls:"ok",text:"Complete",pct};return{cls:"warn",text:d<0?"Missing "+Math.abs(d).toFixed(2)+"%":"Over by "+d.toFixed(2)+"%",pct}}
    function remaining(list){const r=math.subtract(math.fraction(1),sum(list));return num(r)>0?r:math.fraction(.1)}
    function key(path){return path.join("-")}
    function get(path){return path.reduce((a,i)=>a.subs[i],{subs:categories})}
    function addCategory(parent=null){const list=parent?parent.subs:categories;list.push({name:"New category "+(list.length+1),weight:remaining(list),subs:[]});stale();render()}
    function addSub(path){addCategory(get(path))}
    function removeCategory(path){if(!confirm("Are you sure you want to delete this category?"))return;const list=path.length===1?categories:get(path.slice(0,-1)).subs;list.splice(path.at(-1),1);stale();render()}
    function updateName(path,v){get(path).name=v;stale();updateChart()}
    function updateWeight(path,v){get(path).weight=parseWeight(v);stale();refresh()}
    function showGenerate(path){activeGenerate=key(path);render()}
    function cancelGenerate(){activeGenerate=null;render()}
    function generate(path){const count=Number(document.getElementById("count-"+key(path))?.value);if(!Number.isInteger(count)||count<1)return;const cat=get(path),weight=math.fraction(1,count);cat.subs=Array.from({length:count},(_,i)=>({name:cat.name+" Item "+(i+1),weight,subs:[]}));activeGenerate=null;stale();render()}
    function resetAll(){if(categories.length&&!confirm("Reset all categories?"))return;categories=[];hasResults=false;resultsStale=false;activeGenerate=null;document.getElementById("results").innerHTML="";document.getElementById("layout").classList.remove("has-results");document.getElementById("calculateLabel").textContent="Calculate results";render()}
    function valid(list){return !list.length||Math.abs(num(sum(list))-1)<.0001}
    function warnings(list,prefix="",root=true){let out=[];if(root&&!valid(list))out.push("root categories total "+(num(sum(list))*100).toFixed(2)+"%");list.forEach(c=>{if(!c.subs.length)return;const name=prefix?prefix+" / "+c.name:c.name;if(!valid(c.subs))out.push(name+" totals "+(num(sum(c.subs))*100).toFixed(2)+"%");out=out.concat(warnings(c.subs,name,false))});return out}
    function meta(cat){if(!cat.subs.length)return{cls:"",text:""};const b=balance(cat.subs);return{cls:b.cls,text:cat.subs.length+" "+(cat.subs.length===1?"item":"items")+" · "+b.text}}
    function row(cat,path,depth){
      const k=key(path),m=meta(cat),pct=(num(cat.weight)*100).toFixed(2);
      const panel=activeGenerate===k?'<div class="generate"><label for="count-'+k+'">Equal subitems</label><input id="count-'+k+'" class="count" type="number" min="1" value="5"><button class="btn" onclick="generate(['+path+'])">Generate</button><button class="text-btn" onclick="cancelGenerate()">Cancel</button></div>':"";
      return '<div class="row" style="--depth:'+depth+'"><div class="main"><input class="name" aria-label="Category name" value="'+esc(cat.name)+'" oninput="updateName(['+path+'],this.value)"><div id="meta-'+k+'" class="meta '+m.cls+'">'+m.text+'</div></div><div class="weight-cell"><input class="weight" aria-label="Weight as a proportion of one" title="Use 1/3, 0.5 or 1" value="'+esc(formatWeight(cat.weight))+'" oninput="updateWeight(['+path+'],this.value)"><span id="pct-'+k+'" class="equivalent">'+pct+'%</span></div><div class="actions"><button class="icon-btn danger" title="Delete" onclick="removeCategory(['+path+'])">'+ico("trash-2")+'</button>'+(cat.subs.length?"":'<button class="icon-btn" title="Generate equal subitems" onclick="showGenerate(['+path+'])">'+ico("list-plus")+'</button>')+'<button class="icon-btn" title="Add subcategory" onclick="addSub(['+path+'])">'+ico("plus")+'</button></div></div>'+panel;
    }
    function children(list,path,depth){return list.map((cat,i)=>{const p=path.concat(i);return '<div class="node">'+row(cat,p,depth)+(cat.subs.length?'<div class="children">'+children(cat.subs,p,depth+1)+'</div>':"")+'</div>'}).join("")}
    function categoryHtml(){return categories.map((cat,i)=>{const p=palette[i%palette.length];return '<article id="group-'+i+'" class="group '+(cat.subs.length&&!valid(cat.subs)?"invalid":"")+'" style="--group-color:'+p.color+';--group-soft:'+p.soft+';--group-soft-deep:'+p.deep+'">'+row(cat,[i],0)+(cat.subs.length?'<div class="children">'+children(cat.subs,[i],1)+'</div>':"")+'</article>'}).join("")}
    function emptyHtml(){return '<div class="empty"><div><span class="empty-icon">'+ico("list-tree")+'</span><h2>Build your weighting structure</h2><p>Add categories, enter proportions, and create subitems where you need them.</p><button class="btn primary" onclick="addCategory()">'+ico("plus")+'Add first category</button></div></div>'}
    function render(){const has=categories.length>0;document.getElementById("layout").classList.toggle("has-data",has);document.getElementById("reset").hidden=!has;document.getElementById("categories").innerHTML=has?'<div class="category-list">'+categoryHtml()+'</div>':emptyHtml();document.getElementById("editorFooter").innerHTML=has?'<button class="btn" onclick="addCategory()">'+ico("plus")+'Add category</button>':"";refresh();icons()}
    function updateSummary(){const b=balance(categories),line=document.getElementById("rootAllocation"),fill=document.getElementById("rootProgress");line.className="allocation-line "+(categories.length?b.cls:"");line.textContent=categories.length?b.pct.toFixed(2)+"% allocated · "+b.text:"0% allocated";fill.style.width=Math.min(Math.max(b.pct,0),100)+"%";fill.className="fill "+(b.pct>100.0001?"over":b.cls==="ok"?"ok":"")}
    function updateLabels(list=categories,path=[]){list.forEach((cat,i)=>{const p=path.concat(i),k=key(p),pct=document.getElementById("pct-"+k),me=document.getElementById("meta-"+k),m=meta(cat);if(pct)pct.textContent=(num(cat.weight)*100).toFixed(2)+"%";if(me){me.className="meta "+m.cls;me.textContent=m.text}if(p.length===1){const g=document.getElementById("group-"+i);if(g)g.classList.toggle("invalid",cat.subs.length>0&&!valid(cat.subs))}updateLabels(cat.subs,p)})}
    function refresh(){updateSummary();updateLabels();updateChart();updateStatus()}
    function stale(){if(!hasResults||resultsStale)return;resultsStale=true;const notice=document.getElementById("staleNotice");if(notice)notice.innerHTML='<div class="stale">The structure has changed. Recalculate to refresh these values.</div>'}
    function collect(list,prefix="",parent=math.fraction(1),topIndex=null){let out=[];list.forEach((cat,index)=>{const rootIndex=topIndex===null?index:topIndex,name=prefix?prefix+" / "+cat.name:cat.name,total=math.multiply(parent,cat.weight),groupColor=palette[rootIndex%palette.length];out=out.concat(cat.subs.length?collect(cat.subs,name,total,rootIndex):[{name,local:cat.weight,total,color:groupColor.color,soft:groupColor.soft}])});return out}
    function calcState(){if(!collect(categories).length)return{can:false,cls:"",text:"Add a category to calculate results."};const issues=warnings(categories);return issues.length?{can:false,cls:"error",text:"Fix the allocation first: "+issues.join("; ")+". "}:{can:true,cls:"ok",text:"Everything adds up to 100%."}}
    function updateStatus(){const s=calcState(),el=document.getElementById("status");el.className="status "+s.cls;el.textContent=s.text;document.querySelectorAll("[data-calculate]").forEach(b=>b.disabled=!s.can)}
    function finalize(){try{const state=calcState();if(!state.can)return;const items=collect(categories).filter(i=>num(i.total)>0),lcm=items.map(i=>Number(i.total.d)).reduce((a,b)=>math.lcm(a,b),1),ints=items.map(i=>Number(i.total.n)*(lcm/Number(i.total.d))),gcd=ints.reduce((a,b)=>math.gcd(a,b)),finals=ints.map(v=>v/gcd);
      const rows=items.map((item,i)=>'<div class="result-row" style="--result-color:'+item.color+';--result-bg:'+item.soft+'"><div><div class="result-name">'+esc(item.name)+'</div><div class="result-meta">'+(num(item.total)*100).toFixed(4)+'% total</div></div><div class="integer">'+finals[i]+'</div></div>').join("");
      document.getElementById("results").innerHTML='<div class="panel-heading"><div><h2>Integer results</h2><p class="panel-meta">Smallest exact whole-number ratio</p></div></div><div id="staleNotice" class="stale-wrap"></div><div class="result-list">'+rows+'</div>';
      hasResults=true;resultsStale=false;document.getElementById("calculateLabel").textContent="Recalculate results";document.getElementById("layout").classList.add("has-results");updateStatus();icons();document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"})
    }catch(e){console.error(e);const el=document.getElementById("status");el.className="status error";el.textContent="The results could not be calculated."}}
    function updateChart(){const items=collect(categories),box=document.getElementById("chartBox");if(myChart)myChart.destroy();myChart=null;document.getElementById("chartMeta").textContent=items.length+" "+(items.length===1?"final item":"final items");if(!items.length||!window.Chart)return;box.style.height=Math.min(520,Math.max(180,90+items.length*42))+"px";myChart=new Chart(document.getElementById("chart"),{type:"bar",data:{labels:items.map(i=>i.name),datasets:[{data:items.map(i=>num(i.total)*100),backgroundColor:items.map(i=>i.color),borderRadius:3,borderSkipped:false,barThickness:20}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,animation:{duration:180},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>" "+c.parsed.x.toFixed(4)+"%"}}},scales:{x:{beginAtZero:true,grid:{color:"#eceef2"},border:{display:false},ticks:{callback:v=>v+"%"}},y:{grid:{display:false},border:{display:false},ticks:{autoSkip:false,color:"#475467",font:{size:11},callback:function(v){const label=this.getLabelForValue(v);return label.length>28?label.slice(0,27)+"…":label}}}}}})}
    render();
  </script>
</body>
</html>
